    <line x1="235" y1="65" x2="60" y2="215" stroke="#94A3B8" stroke-width="8" stroke-linecap="round"/>
    <!-- D/U Handle -->
    <path d="M180 100 L210 80 M185 110 L155 130" stroke="#0F172A" stroke-width="6" stroke-linecap="round"/>
    <!-- Guard -->
    <path d="M50 200 C40 215 45 235 70 235 L85 220 Z" fill="#C12936"/>
    <!-- Cutting Head -->
    <circle cx="55" cy="225" r="14" fill="#0F172A"/>
