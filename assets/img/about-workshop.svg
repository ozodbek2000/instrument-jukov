<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="bgAbout" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" rx="16" fill="url(#bgAbout)"/>
  
  <!-- Workshop Stand / Workstation -->
  <g transform="translate(60, 40)">
    <!-- Pegboard Tool Wall -->
    <rect x="30" y="30" width="420" height="220" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <g fill="#94A3B8" opacity="0.4">
      <!-- Pegboard Holes Pattern -->
      <circle cx="60" cy="60" r="3"/><circle cx="90" cy="60" r="3"/><circle cx="120" cy="60" r="3"/><circle cx="150" cy="60" r="3"/><circle cx="180" cy="60" r="3"/><circle cx="210" cy="60" r="3"/><circle cx="240" cy="60" r="3"/><circle cx="270" cy="60" r="3"/><circle cx="300" cy="60" r="3"/><circle cx="330" cy="60" r="3"/><circle cx="360" cy="60" r="3"/><circle cx="390" cy="60" r="3"/><circle cx="420" cy="60" r="3"/>
      <circle cx="60" cy="90" r="3"/><circle cx="90" cy="90" r="3"/><circle cx="120" cy="90" r="3"/><circle cx="150" cy="90" r="3"/><circle cx="180" cy="90" r="3"/><circle cx="210" cy="90" r="3"/><circle cx="240" cy="90" r="3"/><circle cx="270" cy="90" r="3"/><circle cx="300" cy="90" r="3"/><circle cx="330" cy="90" r="3"/><circle cx="360" cy="90" r="3"/><circle cx="390" cy="90" r="3"/><circle cx="420" cy="90" r="3"/>
      <circle cx="60" cy="120" r="3"/><circle cx="90" cy="120" r="3"/><circle cx="120" cy="120" r="3"/><circle cx="150" cy="120" r="3"/><circle cx="180" cy="120" r="3"/><circle cx="210" cy="120" r="3"/><circle cx="240" cy="120" r="3"/><circle cx="270" cy="120" r="3"/><circle cx="300" cy="120" r="3"/><circle cx="330" cy="120" r="3"/><circle cx="360" cy="120" r="3"/><circle cx="390" cy="120" r="3"/><circle cx="420" cy="120" r="3"/>
      <circle cx="60" cy="150" r="3"/><circle cx="90" cy="150" r="3"/><circle cx="120" cy="150" r="3"/><circle cx="150" cy="150" r="3"/><circle cx="180" cy="150" r="3"/><circle cx="210" cy="150" r="3"/><circle cx="240" cy="150" r="3"/><circle cx="270" cy="150" r="3"/><circle cx="300" cy="150" r="3"/><circle cx="330" cy="150" r="3"/><circle cx="360" cy="150" r="3"/><circle cx="390" cy="150" r="3"/><circle cx="420" cy="150" r="3"/>
      <circle cx="60" cy="180" r="3"/><circle cx="90" cy="180" r="3"/><circle cx="120" cy="180" r="3"/><circle cx="150" cy="180" r="3"/><circle cx="180" cy="180" r="3"/><circle cx="210" cy="180" r="3"/><circle cx="240" cy="180" r="3"/><circle cx="270" cy="180" r="3"/><circle cx="300" cy="180" r="3"/><circle cx="330" cy="180" r="3"/><circle cx="360" cy="180" r="3"/><circle cx="390" cy="180" r="3"/><circle cx="420" cy="180" r="3"/>
    </g>

    <!-- Hanging Tools (Wrench, Saw, Level, Caliper) -->
    <!-- Wrenches -->
    <path d="M70 70 L70 140 M65 70 A6 6 0 0 1 75 70 M65 140 A6 6 0 0 1 75 140" stroke="#C12936" stroke-width="4" stroke-linecap="round"/>
    <path d="M100 80 L100 135" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
    <path d="M130 90 L130 130" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Level -->
    <rect x="170" y="70" width="130" height="18" rx="3" fill="#C12936"/>
    <circle cx="235" cy="79" r="4" fill="#FEF08A"/>
    
    <!-- Caliper / Square -->
    <path d="M330 65 L390 65 L390 120" stroke="#1E293B" stroke-width="4" fill="none"/>

    <!-- Heavy Workbench Table -->
    <rect x="10" y="240" width="460" height="28" rx="4" fill="#334155"/>
    <rect x="25" y="268" width="430" height="90" fill="#1E293B"/>
    <!-- Red Drawer Cabinets -->
    <rect x="40" y="278" width="120" height="22" rx="3" fill="#C12936"/>
    <line x1="85" y1="289" x2="115" y2="289" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="40" y="306" width="120" height="22" rx="3" fill="#C12936"/>
    <line x1="85" y1="317" x2="115" y2="317" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="40" y="334" width="120" height="22" rx="3" fill="#C12936"/>
    <line x1="85" y1="345" x2="115" y2="345" stroke="#FFFFFF" stroke-width="2"/>

    <!-- Tool on table: Diagnostic device & Drill -->
    <rect x="200" y="220" width="80" height="20" rx="3" fill="#0F172A"/>
    <circle cx="220" cy="230" r="5" fill="#22C55E"/>
    <circle cx="240" cy="230" r="5" fill="#EF4444"/>
    <circle cx="260" cy="230" r="5" fill="#3B82F6"/>
  </g>
</svg>
