<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#FFFFFF"/>
  <circle cx="200" cy="150" r="110" fill="#F8FAFC"/>
  <!-- Concrete Mixer -->
  <g transform="translate(80, 50)">
    <!-- Frame Legs -->
    <path d="M40 180 L80 100 L120 180 M80 100 L190 100 L210 180" stroke="#0F172A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="40" cy="180" r="16" fill="#1E293B" stroke="#0F172A" stroke-width="4"/>
    <circle cx="210" cy="180" r="16" fill="#1E293B" stroke="#0F172A" stroke-width="4"/>
    <!-- Drum -->
    <ellipse cx="140" cy="95" rx="55" ry="60" fill="#C12936"/>
    <path d="M90 85 L140 30 L190 85 Z" fill="#991B1B"/>
    <ellipse cx="140" cy="30" rx="25" ry="10" fill="#0F172A"/>
    <!-- Motor box -->
    <rect x="50" y="80" width="35" height="40" rx="4" fill="#0F172A"/>
    <!-- Wheel Tilt Controller -->
    <circle cx="200" cy="95" r="18" fill="none" stroke="#C12936" stroke-width="4"/>
  </g>
</svg>
